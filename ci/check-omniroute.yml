# CI: static verification only (syntax-check). The playbooks are gated behind
# a placeholder inventory, so CI can never deploy anything.
#
# Local equivalent: see "Static verification" in README.md.
name: check-omniroute

on:
  push:
    paths:
      - "playbooks/**"
      - "vars/**"
      - "requirements.yml"
      - "ansible.cfg"
  pull_request:
    paths:
      - "playbooks/**"
      - "vars/**"
      - "requirements.yml"
      - "ansible.cfg"

jobs:
  syntax-check:
    name: ansible-playbook --syntax-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ansible-core
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible-core

      - name: Install collections
        run: |
          ansible-galaxy collection install -r requirements.yml -p collections

      - name: Syntax-check all omniroute playbooks
        run: |
          set -euo pipefail
          for pb in playbooks/omniroute-*.yml; do
            echo "== $pb"
            ansible-playbook --syntax-check -i inventories/omniroute-dev.ini "$pb"
          done