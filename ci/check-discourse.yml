# CI: static verification only (syntax-check) for the Discourse playbooks
# (ONE-12/ONE-14). Uses the DEVELOPMENT inventory, which never defines the
# production group, so CI can never deploy anything.
#
# Local equivalent: "Static verification" in README.md.
name: check-discourse

on:
  push:
    paths:
      - "playbooks/site.yml"
      - "playbooks/dev-verify.yml"
      - "playbooks/prod-promote.yml"
      - "group_vars/**"
      - "host_vars/**"
      - "roles/discourse-*/**"
      - "templates/**"
      - "requirements.yml"
      - "ansible.cfg"
  pull_request:
    paths:
      - "playbooks/site.yml"
      - "playbooks/dev-verify.yml"
      - "playbooks/prod-promote.yml"
      - "group_vars/**"
      - "host_vars/**"
      - "roles/discourse-*/**"
      - "templates/**"
      - "requirements.yml"
      - "ansible.cfg"

jobs:
  syntax-check:
    name: ansible-playbook --syntax-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ansible-core
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible-core

      - name: Install collections
        run: |
          ansible-galaxy collection install -r requirements.yml -p collections

      - name: Syntax-check Discourse dev playbooks (development inventory)
        run: |
          set -euo pipefail
          for pb in playbooks/site.yml playbooks/dev-verify.yml playbooks/prod-promote.yml; do
            echo "== $pb"
            ansible-playbook --syntax-check -i inventories/development/hosts.ini "$pb"
          done
