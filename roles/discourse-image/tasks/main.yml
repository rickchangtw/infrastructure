---
# discourse-image — build or pull the `discourse-site` image (ONE-12 §1.3 A)
#
# Path A: every site builds its own image by giving `discourse/base` a
# templated app.yml for the pinned `discourse_version`, then does
# `podman build`. The build is deterministic (fixed version tag) and the
# resulting digest is recorded for reproducibility. Production also uses the
# build path (never a community/unmaintained standalone image).
- name: Fail fast if the module collection is unavailable
  ansible.builtin.fail:
    msg: "The containers.podman collection is required. Install it with: ansible-galaxy collection install containers.podman"
  when: false

- name: Ensure a build directory exists for the site image
  ansible.builtin.file:
    path: "{{ discourse_build_dir }}"
    state: directory
    mode: "0755"
    owner: "{{ discourse_run_user }}"
    group: "{{ discourse_run_user }}"
  when: discourse_build_dir is defined

- name: Render app.yml template (pinned version) into the build context
  ansible.builtin.template:
    src: app.yml.j2
    dest: "{{ discourse_build_dir }}/app.yml"
    mode: "0644"
  delegate_to: "{{ inventory_hostname }}"

- name: Build discourse-site image at pinned version tag
  containers.podman.podman_image:
    name: "{{ discourse_image_repo }}"
    tag: "{{ discourse_version | regex_replace('^v', '') }}"
    path: "{{ discourse_build_dir }}"
    state: build
  register: discourse_image_build

- name: Record the built image digest for reproducibility
  ansible.builtin.shell:
    cmd: "podman inspect --format '{{ '{{.Image}}' }}' {{ discourse_site_image }}"
  register: discourse_image_digest
  changed_when: false
  become: false

- name: Persist image digest to a version file
  ansible.builtin.copy:
    dest: "{{ discourse_build_dir }}/image-digest"
    content: "{{ discourse_image_digest.stdout }}\n"
    mode: "0644"
  when: discourse_image_digest.stdout is defined

- name: Confirm image present locally
  ansible.builtin.debug:
    msg: "Site image ready: {{ discourse_site_image }}"
