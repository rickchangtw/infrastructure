# OmniRoute — Development inventory (paperclip-v1 = 100.94.136.15).
#
# The group name `omniroute_dev` is load-bearing: every omniroute playbook
# targets it.
#
# Development host authorized by ONE-12 A1 gate. Rootless deploy account:
# `rick` (confirmed by the operator on 2026-08-29; NOT `deploy`). The omniroute
# playbooks are PODMAN ROOTLESS: they run as `rick` and only elevate for the
# podman package / linger bootstrap; they never touch the Discourse,
# Paperclip/Hermes, or Production services.
#
# Run everything with an explicit inventory so the repo-level ansible.cfg
# default (inventories/development/hosts.ini) is never assumed for omniroute:
#   ansible-playbook -i inventories/omniroute-dev.ini \
#     --vault-password-file <vault-pass> playbooks/omniroute-deploy.yml
[omniroute_dev]
paperclip-v1-dev ansible_host=100.94.136.15 ansible_user=rick

# Locked down for a rootless deploy: local SSH from the operator machine.
[omniroute_dev:vars]
ansible_python_interpreter=auto_silent