# Production inventory (ONE-12)
#
# Intentionally EMPTY. The production host address must be filled in by a
# human operator only after the A3/A4/A5 gates are individually approved.
# This file holds no secrets and no live addresses.
#
# When populated it will look roughly like:
#   [discourse_prod]
#   prod-dc1 ansible_host=... ansible_user=...
#
#   [discourse:children]
#   discourse_prod
#
# The site.yml playbook gates the promote path on the `discourse_prod` group,
# so leaving this file empty is the safety default that makes the production
# playbook a no-op (see playbooks/prod-promote.yml).
