# OmniRoute gateway - Development (paperclip-v1) NON-SECRET variables.
#
# By design this file contains NO secrets. Every sensitive value lives ONLY in
# vars/vault/omniroute-dev.vault.yml (Ansible vault). Secret NAMES per ONE-10
# feasibility §5: OMNIROUTE_API_KEY, OMNIROUTE_INITIAL_PASSWORD.
#
# IMPORTANT (dev-host layout): the Paperclip runtime paths below are the
# proposed paperclip-v1 layout. The operator granted dev-host/inventory access
# MUST confirm/adjust them before the first run; see README.md "Prerequisites".

# Immutable, pinned image tag - upgrades and rollback stay deterministic.
omniroute_image: "diegosouzapw/omniroute:v3.8.51"

# Loopback-only bind - the gateway is never exposed outside the host.
omniroute_host: "127.0.0.1"
omniroute_port: "20128"

omniroute_container_name: "omniroute"
# systemd user unit auto-generated by the containers.podman collection from the
# container name using `container_prefix: container`.
omniroute_unit_name: "container-{{ omniroute_container_name }}"

# Host directory persisted as /data inside the container (rootless :Z SELinux).
# Rootless deploy user on paperclip-v1 is `rick` (confirmed by the operator
# 2026-08-29); adjust home if the host layout differs.
omniroute_data_dir: "/home/rick/.local/share/omniroute"

# Boot persistence for rootless containers via `loginctl enable-linger`
# (requires sudo/polkit; failures are non-fatal - see README).
omniroute_enable_linger: true

# ---- Paperclip agent runtime (used by omniroute-rollback.yml to restore the
#      ORIGINAL model provider). Adjust to the actual paperclip-v1 layout.
#      Leave any of these empty ("") if the path is unknown / not applicable;
#      the related tasks are skipped.
paperclip_env_path: "/etc/paperclip/agent.env"
paperclip_env_backup_path: "/var/backups/paperclip/agent.env.pre-omniroute"
paperclip_user: "paperclip"
paperclip_agent_unit: "paperclip-agent"

# ---- Health URLs asserted during rollback to prove the primary stack is
#      untouched. Set hermes_health_url to "" if the host has no 3101 service.
paperclip_health_url: "http://127.0.0.1:3100/api/health"
hermes_health_url: "http://127.0.0.1:3101/"