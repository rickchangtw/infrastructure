[defaults]
# Paths are relative to this file (the infra/ repo root).
inventory = inventories/development/hosts.ini
roles_path = roles
collections_path = collections
retry_files_enabled = False
host_key_checking = False
stdout_callback = yaml

# Never write secrets into generated local files outside the target host.
# Secret values always come from the host-side 0600 env files or the Ansible
# vault (vars/vault/*.vault.yml) at run time.

[ssh_connection]
# Rootless deploy only. The container runtime and systemd user units are owned
# by the target account (discourse_run_user); the playbook elevates only for
# specific bootstrap steps (installing the podman packages, enable-linger).
